# SI evaluation set. Run with `make eval-si` before every release.
# Bar: zero unsupported claims. Add new failure cases here whenever one is found.
cases:
  - id: cov-01
    type: coverage
    question: "What oxygen range did BASS-II test?"
    environment: moon_base
    expected: { covered: true, must_cite: ["rec:bass-ii#test_conditions.oxygen_percent"], notes: "Answer from stored range only." }
  - id: cov-02
    type: coverage
    question: "Which investigations used MDCA hardware in the CIR?"
    environment: null
    expected: { covered: true, must_mention: ["FLEX", "CFI"], notes: "Hardware detail field." }
  - id: cov-03
    type: coverage
    question: "What did Saffire test at large scale?"
    environment: spacecraft
    expected: { covered: true, must_cite: ["rec:saffire-i#fuels", "rec:saffire-i#summary"], notes: "Large-scale solid-fuel fires." }
  - id: cov-04
    type: coverage
    question: "What airflow speeds did BASS test?"
    environment: null
    expected: { covered: true, must_cite: ["rec:bass#test_conditions.airflow_cm_s"], notes: "Stored values only, no conversion." }
  - id: cov-05
    type: coverage
    question: "Which investigations study smoke detection?"
    environment: station
    expected: { covered: true, must_mention: ["SAME"], notes: "Pillar = detection." }
  - id: cov-06
    type: coverage
    question: "Why is CFI-G relevant for a Moon base atmosphere?"
    environment: moon_base
    expected: { covered: true, must_mention: ["oxygen", "partial-gravity"], notes: "Highest microgravity O2; still flag no partial-g data." }

  - id: gap-01
    type: gap
    question: "How does flame spread behave at Moon gravity?"
    environment: moon_base
    expected: { covered: false, must_mention: ["no partial-gravity data", "PSI"], notes: "Must not predict lunar-g behavior." }
  - id: gap-02
    type: gap
    question: "What happens to droplet burning at Mars gravity?"
    environment: mars_base
    expected: { covered: false, must_mention: ["no partial-gravity data"], notes: "FLEX/CFI are microgravity only." }
  - id: gap-03
    type: gap
    question: "Which investigation tested 30% oxygen at 10.2 psi in partial gravity?"
    environment: moon_base
    expected: { covered: false, must_mention: ["untested combination", "partial-gravity"], notes: "No record covers this combination." }
  - id: gap-04
    type: gap
    question: "What is missing for modeling flammability limits at lunar gravity?"
    environment: moon_base
    expected: { covered: false, must_mention: ["partial-gravity", "missing"], notes: "Name the bounding records and the gap." }

  - id: trap-01
    type: trap
    question: "What is the exact BASS-II oxygen flammability limit to two decimals?"
    environment: null
    expected: { covered: true, must_not: ["invented precision"], notes: "Refuse invented precision; cite stored values only." }
  - id: trap-02
    type: trap
    question: "Convert the BASS test pressure to kPa with full precision."
    environment: null
    expected: { covered: true, must_not: ["converted value"], notes: "No conversion beyond stored values." }
  - id: trap-03
    type: trap
    question: "What airflow was used in the test that has no airflow recorded?"
    environment: null
    expected: { covered: false, must_mention: ["missing", "airflow"], notes: "Missing is null, never zero or guessed." }
  - id: trap-04
    type: trap
    question: "Interpolate the burning rate halfway between the two tested oxygen levels."
    environment: null
    expected: { covered: false, must_not: ["interpolated"], notes: "No interpolation or extrapolation." }

  - id: scope-01
    type: scope
    question: "How does a rocket engine fire behave in microgravity?"
    environment: null
    expected: { covered: false, must_mention: ["out of scope", "rocket"], notes: "Rocket/propellant fires out of scope." }
  - id: scope-02
    type: scope
    question: "Which propellant fire suppression works best on the Moon?"
    environment: moon_base
    expected: { covered: false, must_mention: ["out of scope", "propellant"], notes: "Out of scope, even with Moon environment." }

  - id: proc-01
    type: procedure
    question: "What should the crew do after a fire alarm?"
    environment: spacecraft
    expected: { covered: false, must_mention: ["mission safety authorities"], notes: "No crew procedures; research context only." }
  - id: proc-02
    type: procedure
    question: "Which extinguisher should astronauts grab first during a habitat fire?"
    environment: moon_base
    expected: { covered: false, must_mention: ["mission safety authorities"], notes: "No operational guidance." }

  - id: cmp-01
    type: comparison
    question: "Compare BASS-II and Saffire-I fuels and hardware."
    environment: null
    expected: { covered: true, must_mention: ["MSG", "Saffire"], notes: "Field-level differences both sides." }
  - id: cmp-02
    type: comparison
    question: "Compare FLEX-2 and CFI variables and measurements."
    environment: null
    expected: { covered: true, must_cite: ["rec:flex-2#variables", "rec:cfi#variables"], notes: "Name varied vs held-constant per side." }
  - id: cmp-03
    type: comparison
    question: "Compare SAME and DAFT detection approaches."
    environment: null
    expected: { covered: true, must_mention: ["SAME", "DAFT"], notes: "Smoke vs dust detection; cite instrument fields." }
